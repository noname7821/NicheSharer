name: Build tweak

on:
  push:
    branches: [main]
    paths:
      - 'tweak/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: tweak
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos deps
        run: brew install ldid xz dpkg zstd

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Link iOS SDK
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p "$HOME/theos/sdks"
          ln -s "$SDK_PATH" "$HOME/theos/sdks/iPhoneOS.sdk"
          xcodebuild -version

      - name: Build package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: NicheShare-tweak
          path: tweak/packages/*.deb
