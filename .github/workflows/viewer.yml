name: Build viewer exe

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish exe
        run: dotnet publish viewer/NicheShareViewer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: NicheShareViewer-exe
          path: publish/NicheShareViewer.exe
