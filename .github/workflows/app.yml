name: Build receiver app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Build app
        working-directory: app
        run: |
          set -x
          TMP="$RUNNER_TEMP/NicheShareApp"
          xcodebuild \
            -project NicheShareApp.xcodeproj \
            -scheme NicheShare \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$TMP" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          ls -la "$TMP/Build/Products/Release-iphoneos/" || true

      - name: Package IPA
        working-directory: app
        run: |
          set -x
          TMP="$RUNNER_TEMP/NicheShareApp"
          STAGE="$TMP/stage"
          APP="$TMP/Build/Products/Release-iphoneos"
          rm -rf Payload "$STAGE"
          mkdir -p "$STAGE/Payload"
          mv "$APP/NicheShare.app" "$STAGE/Payload/NicheShare.app"
          chmod -R 0755 "$STAGE/Payload/NicheShare.app"
          codesign --force --sign - --timestamp=none "$STAGE/Payload/NicheShare.app" || true
          rm -rf "$STAGE/Payload/NicheShare.app/_CodeSignature"
          mkdir -p packages
          cd "$STAGE" && zip -r9 "$GITHUB_WORKSPACE/app/packages/NicheShare-app.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/app/packages/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NicheShare-app-ipa
          path: app/packages/NicheShare-app.ipa
