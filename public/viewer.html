<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NicheShare Viewer (PC)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#f1f5f9;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:2rem 1.25rem 3rem}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;text-align:center}
h1 span{background:linear-gradient(135deg,#BF5AF2,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#71717a;font-size:.85rem;margin:.35rem 0 1.5rem}
.card{background:rgba(18,19,22,.45);border:1px solid rgba(39,39,42,.6);border-radius:1.25rem;padding:1.5rem;margin-bottom:1.25rem}
.row{display:flex;gap:.6rem}
input{flex:1;padding:.8rem 1rem;background:rgba(0,0,0,.4);border:1.5px solid rgba(39,39,42,.9);border-radius:.9rem;color:#fff;font-size:1.25rem;text-align:center;letter-spacing:.35em;font-weight:700;font-family:inherit}
input:focus{outline:none;border-color:rgba(191,90,242,.6)}
button{padding:.8rem 1.4rem;border:none;border-radius:.9rem;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#BF5AF2,#8B5CF6);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(39,39,42,.7);color:#e4e4e7}
.status{display:flex;align-items:center;gap:.6rem;font-size:.85rem;font-weight:600;color:#a1a1aa;margin-top:1rem}
.dot{width:8px;height:8px;border-radius:50%;background:#52525b;flex-shrink:0}
.dot.on{background:#22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.4}}
#screen{width:100%;aspect-ratio:9/16;max-height:60vh;object-fit:contain;background:#000;border-radius:1rem;border:1px solid rgba(39,39,42,.6);cursor:crosshair;display:none}
#pad{width:100%;aspect-ratio:9/12;background:rgba(255,255,255,.03);border:1px dashed rgba(39,39,42,.9);border-radius:1rem;cursor:crosshair;touch-action:none}
#log{font-family:monospace;font-size:.75rem;color:#71717a;max-height:140px;overflow:auto;margin-top:1rem;white-space:pre-wrap}
.hint{font-size:.78rem;color:#52525b;margin-top:.6rem}
kbd{background:rgba(255,255,255,.08);border-radius:.3rem;padding:.05rem .35rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>NicheShare <span>Viewer</span></h1>
  <p class="sub">Enter the code shown on the iPhone</p>

  <div class="card">
    <div class="row">
      <input id="code" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="off">
      <button id="connectBtn">Connect</button>
      <button id="dropBtn" class="ghost" style="display:none">Leave</button>
    </div>
    <div class="status"><div class="dot" id="dot"></div><span id="statusText">Not connected</span></div>
  </div>

  <div class="card">
    <img id="screen" alt="phone screen">
    <canvas id="pad"></canvas>
    <p class="hint">Click/tap the pad to send a tap (x/y 0..1). Type while connected to send keys. Live frames appear here once the phone sends them.</p>
    <div id="log"></div>
  </div>
</div>

<script>
const codeInput = document.getElementById('code');
const connectBtn = document.getElementById('connectBtn');
const dropBtn = document.getElementById('dropBtn');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const screen = document.getElementById('screen');
const pad = document.getElementById('pad');
const logEl = document.getElementById('log');
let ws = null, keepAlive = null;

function log(msg) {
  const t = new Date().toLocaleTimeString();
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(on, text) {
  dot.classList.toggle('on', on);
  statusText.textContent = text;
}

connectBtn.onclick = async () => {
  const code = codeInput.value.replace(/\D/g, '');
  if (code.length !== 6) { setStatus(false, 'Code needs 6 digits'); return; }
  try {
    const res = await fetch(`/api/room/${code}`);
    if (!res.ok) { setStatus(false, 'No such room (expired?)'); return; }
    const info = await res.json();
    if (!info.hasPhone) { setStatus(false, 'Phone not connected yet'); return; }
  } catch (e) { setStatus(false, 'Server unreachable'); return; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws?code=${code}&role=pc`);
  ws.onopen = () => {
    setStatus(true, `Connected to ${code}`);
    connectBtn.style.display = 'none';
    dropBtn.style.display = '';
    log(`joined room ${code}`);
    keepAlive = setInterval(() => ws && ws.send(JSON.stringify({ t: 'ping' })), 25000);
  };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.t === 'status') {
      log(`phone status: ${JSON.stringify(msg.status)}`);
    } else if (msg.t === 'frame' && msg.data) {
      screen.style.display = 'block';
      screen.src = 'data:image/jpeg;base64,' + msg.data;
    }
  };
  ws.onclose = (ev) => { leave(`Closed (${ev.code})`); };
  ws.onerror = () => { leave('Connection error'); };
};

function leave(text) {
  clearInterval(keepAlive);
  if (ws) { ws.close(); ws = null; }
  setStatus(false, text || 'Not connected');
  connectBtn.style.display = '';
  dropBtn.style.display = 'none';
}
dropBtn.onclick = () => leave();

function sendInput(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(Object.assign({ t: 'input' }, obj)));
    log(`sent ${JSON.stringify(obj)}`);
  }
}

function padPos(el, ev) {
  const r = el.getBoundingClientRect();
  const cx = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
  const cy = (ev.touches && ev.touches[0]) ? ev.touches[0].clientY : ev.clientY;
  return {
    x: Math.min(1, Math.max(0, (cx - r.left) / r.width)),
    y: Math.min(1, Math.max(0, (cy - r.top) / r.height)),
  };
}
function tapAt(el, ev) {
  const p = padPos(el, ev);
  sendInput({ kind: 'tap', x: +p.x.toFixed(4), y: +p.y.toFixed(4) });
}
pad.addEventListener('pointerdown', (ev) => tapAt(pad, ev));
screen.addEventListener('pointerdown', (ev) => tapAt(screen, ev));
document.addEventListener('keydown', (ev) => {
  if (!ws || ev.target === codeInput) return;
  if (ev.key.length === 1 || ev.key === 'Enter' || ev.key === 'Backspace') {
    sendInput({ kind: 'key', key: ev.key });
  }
});
codeInput.addEventListener('input', () => {
  codeInput.value = codeInput.value.replace(/\D/g, '');
});
</script>
</body>
</html>
